[workspace]
resolver = "3"
members = ["crates/nmmail-core", "crates/nmmail-daemon", "crates/nmmail-testserver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
nmmail-core = { path = "crates/nmmail-core" }
anyhow = "1"
tokio = { version = "1.54", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tracing-appender = "0.2"
mail-parser = "1"
mail-builder = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 1
