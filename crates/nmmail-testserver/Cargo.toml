[package]
name = "nmmail-testserver"
description = "In-memory IMAP + SMTP server for NM Mail tests and local development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nmmail-testserver"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
mail-parser.workspace = true
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures.workspace = true
